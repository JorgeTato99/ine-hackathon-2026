name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.14 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.14.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py
      - run: uv run --locked python scripts/check_profiles.py data
      - run: uv run --locked python scripts/check_profiles.py notebooks
      - run: uv run --locked python scripts/check_environment.py
      - name: Audit selected environment
        if: runner.os == 'Linux'
        run: uv run --locked pip-audit --skip-editable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/tests.xml
          if-no-files-found: ignore

  check:
    if: always()
    needs: [python]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: python -c "import json,os,sys;sys.exit(0 if all(v['result']=='success' for v in json.loads(os.environ['RESULTS']).values()) else 1)"
