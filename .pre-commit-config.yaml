# Los hooks usan las mismas versiones de uv.lock que el entorno y CI.
# Preparar primero: uv sync --locked --group hooks
repos:
  - repo: builtin
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff
        entry: uv run --locked --no-sync ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --no-sync ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Mypy
        entry: uv run --locked --no-sync mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: bandit
        name: Bandit
        entry: uv run --locked --no-sync bandit -c pyproject.toml -r src scripts
        language: system
        pass_filenames: false
        types: [python]
      - id: frontend-lint
        name: Frontend ESLint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.[cm]?[jt]sx?$
      - id: frontend-format
        name: Frontend Prettier
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(json|md|css|[cm]?[jt]sx?)$
