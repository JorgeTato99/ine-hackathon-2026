server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    expires -1;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/geo+json text/css image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /data/municipios.geojson {
        default_type application/geo+json;
        try_files $uri =404;
    }

    location = /data/municipios.gpkg {
        default_type application/geopackage+sqlite3;
        try_files $uri =404;
    }

    location /_next/static/ {
        expires 365d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
